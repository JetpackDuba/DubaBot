[package]
name = "duba_bot"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
#serenity = { version = "0.11.5", default-features = false, features = ["client", "gateway", "rustls_backend", "model"] }
serenity = { version = "0.12.5", default-features = false, features = [
    "client", "gateway", "rustls_backend", "model", "framework", "standard_framework", "cache"
#    "builder",
#    "chrono",
#    "client",
#    "framework",
#    "gateway",
#    "http",
#    "model",
#    "standard_framework",
#    "utils",
#    "rustls_backend",
#    "cache",
] }
poise = { version = "0.6.1" }
#symphonia-core = { version = "0.5.5" }
symphonia = { version = "0.5.5", features = ["default"] }
tokio = { version = "1.21.2", features = ["macros", "rt-multi-thread", "signal"] }
dotenvy = "0.15"
songbird = { version = "0.5.0", default-features = true }
tracing = "0.1"
tracing-subscriber = "0.3.17"
tracing-futures = "0.2"
serde = "1.0.178"
serde_json = "1.0.104"
rand = "0.8.5"
reqwest = "0.12.24"
